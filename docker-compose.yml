services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    networks:
      - tennis-doc-ia

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tennis-doc-ia

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
    networks:
      - tennis-doc-ia

  javaparser:
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - javaparser_cache:/opt/javaparser_cache
    command: |
      sh -c "rm -rf /opt/parser-java && git clone ${PARSER_JAVA_REPO_URL} /opt/parser-java && cd /opt/parser-java && mvn package -DskipTests -q && java -jar target/javaparser-service-1.0-SNAPSHOT-jar-with-dependencies.jar"
    environment:
      PARSER_JAVA_REPO_URL: ${PARSER_JAVA_REPO_URL}
    networks:
      - tennis-doc-ia

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    expose:
      - "4000"
    configs:
      - source: litellm_config
        target: /app/config.yaml
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL}
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tennis-doc-ia

  indexer:
    image: python:3.13-slim
    restart: unless-stopped
    expose:
      - "8001"
    volumes:
      - indexer_cache:/opt/indexer_cache
      - repos_data:/repos
    command:
      - sh
      - -c
      - |
        set -e
        # git lo usa repo_clone.py para el clon local (búsqueda en caliente)
        apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
        pip install --quiet --no-cache-dir dulwich
        python3 -c "
        import os, shutil
        from dulwich import porcelain
        target = '/opt/indexer'
        shutil.rmtree(target, ignore_errors=True)
        porcelain.clone(os.environ['INDEXER_REPO_URL'], target)
        "
        pip install --quiet --no-cache-dir -r /opt/indexer/requirements.txt
        exec uvicorn main:app --host 0.0.0.0 --port 8001 --app-dir /opt/indexer --workers 3
    environment:
      INDEXER_REPO_URL: ${INDEXER_REPO_URL}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_EMBED_MODEL: ${OPENROUTER_EMBED_MODEL}
      VECTOR_SIZE: ${VECTOR_SIZE}
      NEO4J_URL: ${NEO4J_URL}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JAVAPARSER_URL: ${JAVAPARSER_URL}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      INDEXER_API_KEY: ${INDEXER_API_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_DESTINATARIO: ${EMAIL_DESTINATARIO}
    depends_on:
      - qdrant
      - neo4j
      - javaparser
    networks:
      - tennis-doc-ia

  tennis-doc:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    restart: unless-stopped
    ports:
      - "3502:8080"
    volumes:
      - webui_data:/app/backend/data
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tennis-iniciativas-documentacion-ia-bi83zv-postgres-1:5432/${POSTGRES_DB}
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_URL: ${WEBUI_URL}
      DEFAULT_USER_ROLE: user
      WEBUI_DEFAULT_LOCALE: es-ES
      DEFAULT_LOCALE: es-ES
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      CORS_ALLOW_ORIGIN: "http://172.18.20.134:3502"
      ENABLE_WEBSOCKET_SUPPORT: "true"
      ENABLE_PERSISTENT_CONFIG: "true"
      ENABLE_SIGNUP: ${ENABLE_SIGNUP}
      WEBUI_NAME: ${WEBUI_NAME}
      INDEXER_API_KEY: ${INDEXER_API_KEY}
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embedding
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - tennis-doc-ia

configs:
  litellm_config:
    content: |
      model_list:
        # Principal — calidad máxima, barato
        - model_name: chat
          litellm_params:
            model: deepseek/deepseek-v4-flash
            api_base: "https://openrouter.ai/api/v1"
            api_key: os.environ/OPENROUTER_API_KEY

        # Fallback — si V4 Pro tiene latencia alta
        # - model_name: chat-fallback
        #   litellm_params:
        #     model: deepseek/deepseek-v4-pro
        #     api_base: "https://openrouter.ai/api/v1"
        #     api_key: os.environ/OPENROUTER_API_KEY

        # Embeddings
        - model_name: embedding
          litellm_params:
            model: openrouter/qwen/qwen3-embedding-8b
            api_base: "https://openrouter.ai/api/v1"
            api_key: os.environ/OPENROUTER_API_KEY

      litellm_settings:
        drop_params: true
        request_timeout: 60

      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
        database_url: os.environ/DATABASE_URL

volumes:
  qdrant_data:
    external: true
    name: tennis-doc-qdrant-data
  pg_data:
    external: true
    name: tennis-doc-postgres-data
  indexer_cache:
    external: true
    name: tennis-doc-indexer-cache
  webui_data:
    external: true
    name: tennis-doc-webui-data
  neo4j_data:
    external: true
    name: tennis-doc-neo4j-data
  neo4j_logs:
    external: true
    name: tennis-doc-neo4j-logs
  javaparser_cache:
    external: true
    name: tennis-doc-javaparser-cache
  repos_data:
    external: true
    name: tennis-doc-repos-data

networks:
  tennis-doc-ia:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/28
          gateway: 172.40.0.1